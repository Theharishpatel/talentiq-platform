[project]
name = "talentiq"
version = "0.1.0"
description = "TalentIQ Hiring Intelligence Platform"
requires-python = ">=3.12"

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
]

ignore = []

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

addopts = "-ra -q"