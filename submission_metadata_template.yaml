ai_usage_summary: |

  ChatGPT was used for architecture discussions,
  debugging, code review, and implementation guidance.

  Candidate embeddings, ranking logic,
  feature engineering, and reasoning pipeline
  were implemented and validated by the team.

  No candidate data was shared with external
  AI services during ranking.

# Methodology

methodology_summary: |

  TalentiQ is an offline semantic candidate ranking
  system designed for recruiter-centric hiring.

  The pipeline performs offline feature engineering
  over candidate profiles, generates dense embeddings,
  indexes candidates in Qdrant, extracts structured
  information from Job Descriptions using Role
  Intelligence, performs semantic retrieval,
  applies a weighted multi-factor ranking model
  (semantic similarity, experience,
  recruitability, career growth, behavioral
  signals, consistency, and risk), generates
  recruiter-friendly reasoning, and exports the
  top 100 candidates in the required submission
  format.

  The complete ranking process executes entirely
  on CPU without any external API calls.

